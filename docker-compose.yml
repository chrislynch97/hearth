services:
  hearth:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      - PORT=8787
      - DATABASE_URL=file:/data/app.db
      - CLIENT_DIR=/app/dist/client
    # Proper PID 1 (tini) so SIGTERM reaches node for a clean shutdown.
    init: true
    restart: unless-stopped
