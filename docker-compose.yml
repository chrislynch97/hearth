services:
  hearth:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      - PORT=8787
      # Embedded PGlite (Postgres) in the mounted volume. Point this at a
      # `postgres://…` URL instead to use an external Postgres server.
      - DATABASE_URL=pglite:/data/pgdata
      - CLIENT_DIR=/app/dist/client
      # Password-less on a trusted home LAN: launch with the env var set, e.g.
      #   HEARTH_ALLOW_OPEN=1 docker compose up -d      (PowerShell: $env:HEARTH_ALLOW_OPEN=1; docker compose up -d)
      # Left unset it defaults to 0 (safe): an open instance on a network address
      # refuses to serve data until you set an owner password. Do NOT set it to 1
      # on an internet-exposed host — anyone who can reach it gets owner access.
      - HEARTH_ALLOW_OPEN=${HEARTH_ALLOW_OPEN:-0}
      # Set to 1 on an internet-facing instance: the startup safety checks then
      # refuse to boot on a config that would expose your data (e.g. the flag
      # above left at 1), instead of only warning. Leave 0 on a home LAN.
      - HEARTH_PUBLIC=${HEARTH_PUBLIC:-0}
    # Proper PID 1 (tini) so SIGTERM reaches node for a clean shutdown.
    init: true
    restart: unless-stopped
    # Cap container logs so they can't fill the disk on an unattended box (#57).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
