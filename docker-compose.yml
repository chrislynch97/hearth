services:
  hearth:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      - PORT=8787
      - DATABASE_URL=file:/data/app.db
      - CLIENT_DIR=/app/dist/client
      # By default an open (password-less) instance refuses to serve data on a
      # network-reachable address — set an owner password (Settings → Security)
      # to unlock it. To instead run password-less on a trusted home LAN,
      # uncomment the line below. Do NOT enable it on an internet-exposed host:
      # anyone who can reach it would have full owner access.
      # - HEARTH_ALLOW_OPEN=1
    # Proper PID 1 (tini) so SIGTERM reaches node for a clean shutdown.
    init: true
    restart: unless-stopped
