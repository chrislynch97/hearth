# Hearth from the prebuilt GHCR image (the "managed" deploy), rather than
# building from source like docker-compose.yml. Updating is then a pull instead of
# a rebuild, which is what makes in-app one-click / automatic updates possible.
#
#   docker compose -f docker-compose.ghcr.yml up -d      # → http://localhost:8787
#   docker compose -f docker-compose.ghcr.yml pull       # fetch a newer image
#   docker compose -f docker-compose.ghcr.yml up -d       # apply it
#
# To enable in-app one-click / scheduled updates, also install the host updater
# so it can run the pull + recreate when the app asks (Linux: systemd/cron with
# scripts/hearth-updater.sh; Windows: Task Scheduler with scripts/hearth-updater.ps1
# — see docs/deployment.md → Updating). The app itself never gets Docker access —
# it only writes a request file into ./data/updates.
services:
  hearth:
    image: ghcr.io/chrislynch97/hearth:latest
    ports:
      - "8787:8787"
    volumes:
      # Also the exchange point for the host updater's control files (./data/updates).
      - ./data:/data
    environment:
      - PORT=8787
      - DATABASE_URL=pglite:/data/pgdata
      - CLIENT_DIR=/app/dist/client
      # Optional GitHub tokens (read-only PAT), passed through from .env so the
      # update check works on a private repo (#170) and in-app feedback (#86) can
      # file issues. Empty default = feature off. See docs/deployment.md.
      - HEARTH_UPDATE_TOKEN=${HEARTH_UPDATE_TOKEN:-}
      - HEARTH_FEEDBACK_TOKEN=${HEARTH_FEEDBACK_TOKEN:-}
      - HEARTH_FEEDBACK_REPO=${HEARTH_FEEDBACK_REPO:-}
      # Tells the in-app update UI this is the image deploy: it shows pull-based
      # commands and (with the host updater) the one-click / auto-update options.
      - HEARTH_DEPLOY=image
      - HEARTH_ALLOW_OPEN=${HEARTH_ALLOW_OPEN:-0}
      - HEARTH_PUBLIC=${HEARTH_PUBLIC:-0}
      # Behind a reverse proxy or tunnel: the hop count that recovers the real
      # client IP, plus the escape hatches for a proxy that doesn't forward
      # x-forwarded-proto or rewrites Host. See docs/deployment.md.
      - HEARTH_TRUST_PROXY=${HEARTH_TRUST_PROXY:-}
      - HEARTH_SECURE_COOKIES=${HEARTH_SECURE_COOKIES:-}
      - HEARTH_ALLOWED_ORIGINS=${HEARTH_ALLOWED_ORIGINS:-}
      # Email (#111) — invite-by-email, address confirmation, password reset.
      # Off until HEARTH_MAIL_TRANSPORT is set. See docs/deployment.md → Email.
      - HEARTH_MAIL_TRANSPORT=${HEARTH_MAIL_TRANSPORT:-}
      - HEARTH_MAIL_FROM=${HEARTH_MAIL_FROM:-}
      - HEARTH_PUBLIC_URL=${HEARTH_PUBLIC_URL:-}
      - HEARTH_SMTP_HOST=${HEARTH_SMTP_HOST:-}
      - HEARTH_SMTP_PORT=${HEARTH_SMTP_PORT:-}
      - HEARTH_SMTP_TLS=${HEARTH_SMTP_TLS:-}
      - HEARTH_SMTP_USER=${HEARTH_SMTP_USER:-}
      - HEARTH_SMTP_PASS=${HEARTH_SMTP_PASS:-}
      # Local snapshots: how many to keep, and a directory on another volume if
      # you want them off the database's disk. See docs/deployment.md → Data & backups.
      - HEARTH_BACKUP_KEEP=${HEARTH_BACKUP_KEEP:-}
      - HEARTH_BACKUP_LOCAL_DIR=${HEARTH_BACKUP_LOCAL_DIR:-}
      # Off-site backups (#39, #114). Off unless set in .env; `directory` mode
      # also needs its target mounted in. See docs/deployment.md → Off-site backups.
      - HEARTH_BACKUP_OFFSITE=${HEARTH_BACKUP_OFFSITE:-off}
      - HEARTH_BACKUP_PRIMARY=${HEARTH_BACKUP_PRIMARY:-local}
      - HEARTH_BACKUP_PASSPHRASE=${HEARTH_BACKUP_PASSPHRASE:-}
      - HEARTH_BACKUP_DIR=${HEARTH_BACKUP_DIR:-}
      - HEARTH_BACKUP_WEBHOOK_URL=${HEARTH_BACKUP_WEBHOOK_URL:-}
      - HEARTH_BACKUP_WEBHOOK_AUTH=${HEARTH_BACKUP_WEBHOOK_AUTH:-}
      - HEARTH_BACKUP_S3_ENDPOINT=${HEARTH_BACKUP_S3_ENDPOINT:-}
      - HEARTH_BACKUP_S3_BUCKET=${HEARTH_BACKUP_S3_BUCKET:-}
      - HEARTH_BACKUP_S3_REGION=${HEARTH_BACKUP_S3_REGION:-}
      - HEARTH_BACKUP_S3_ACCESS_KEY_ID=${HEARTH_BACKUP_S3_ACCESS_KEY_ID:-}
      - HEARTH_BACKUP_S3_SECRET_ACCESS_KEY=${HEARTH_BACKUP_S3_SECRET_ACCESS_KEY:-}
      - HEARTH_BACKUP_S3_PREFIX=${HEARTH_BACKUP_S3_PREFIX:-}
      # Monitoring (#57): the /healthz free-space threshold, a dead-man's-switch
      # ping after each backup, and a webhook for backup / failed-login alerts.
      # See docs/deployment.md → Monitoring & alerting.
      - HEARTH_DISK_MIN_FREE_MB=${HEARTH_DISK_MIN_FREE_MB:-}
      - HEARTH_BACKUP_HEARTBEAT_URL=${HEARTH_BACKUP_HEARTBEAT_URL:-}
      - HEARTH_ALERT_WEBHOOK=${HEARTH_ALERT_WEBHOOK:-}
      - HEARTH_AUTH_ALERT_THRESHOLD=${HEARTH_AUTH_ALERT_THRESHOLD:-}
      # Updates: `off` stops the release check contacting GitHub at all. The two
      # paths below only matter if you relocate the updater exchange or run a
      # compose file other than this one. See docs/deployment.md → Updating.
      - HEARTH_UPDATE_CHECK=${HEARTH_UPDATE_CHECK:-}
      - HEARTH_UPDATE_DIR=${HEARTH_UPDATE_DIR:-}
      - HEARTH_COMPOSE_FILE=${HEARTH_COMPOSE_FILE:-}
    # Proper PID 1 (tini) so SIGTERM reaches node for a clean shutdown.
    init: true
    restart: unless-stopped
    # Cap container logs so they can't fill the disk on an unattended box (#57).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
