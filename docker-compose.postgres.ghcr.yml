# Hearth from the prebuilt GHCR image AND a real Postgres server — the managed
# equivalent of docker-compose.postgres.yml (which builds from source). Updating
# the app is a pull instead of a rebuild, enabling in-app one-click / automatic
# updates.
#
# Set POSTGRES_PASSWORD in a .env file next to this one:
#
#   POSTGRES_PASSWORD=<random>
#   # optional, defaults below:
#   HEARTH_PORT=9787
#
#   docker compose -f docker-compose.postgres.ghcr.yml up -d      # → http://localhost:9787
#   docker compose -f docker-compose.postgres.ghcr.yml pull       # fetch a newer image
#   docker compose -f docker-compose.postgres.ghcr.yml up -d       # apply it
#
# For in-app one-click / scheduled updates, also install the host updater (see
# scripts/hearth-updater.sh). The app never gets Docker access — it only writes a
# request file into ./data/updates.
services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=hearth
      - POSTGRES_DB=hearth
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - hearth-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    # Cap container logs so they can't fill the disk on an unattended box (#57).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  hearth:
    image: ghcr.io/chrislynch97/hearth:latest
    ports:
      - "${HEARTH_PORT:-9787}:8787"
    volumes:
      # Backups + the host updater's control files (./data/updates). The database
      # itself lives in the `db` service's volume.
      - ./data:/data
    environment:
      - PORT=8787
      - DATABASE_URL=postgres://hearth:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/hearth
      - CLIENT_DIR=/app/dist/client
      # Optional GitHub tokens (read-only PAT), passed through from .env so the
      # update check works on a private repo (#170) and in-app feedback (#86) can
      # file issues. Empty default = feature off. See docs/deployment.md.
      - HEARTH_UPDATE_TOKEN=${HEARTH_UPDATE_TOKEN:-}
      - HEARTH_FEEDBACK_TOKEN=${HEARTH_FEEDBACK_TOKEN:-}
      - HEARTH_FEEDBACK_REPO=${HEARTH_FEEDBACK_REPO:-}
      # On a postgres:// URL the backup runner would otherwise default to
      # ./data/backups inside the container. Default it to the mounted volume;
      # .env can still point it somewhere else.
      - HEARTH_BACKUP_LOCAL_DIR=${HEARTH_BACKUP_LOCAL_DIR:-/data/backups}
      # How many local snapshots to keep. See docs/deployment.md → Data & backups.
      - HEARTH_BACKUP_KEEP=${HEARTH_BACKUP_KEEP:-}
      # Off-site backups (#39, #114). Off unless set in .env. `HEARTH_BACKUP_DIR`
      # is the `directory` target and needs its own mount; the `s3` target needs
      # nothing mounted, which is why it's the one to use when ./data isn't
      # durable. See docs/deployment.md → Off-site backups.
      - HEARTH_BACKUP_OFFSITE=${HEARTH_BACKUP_OFFSITE:-off}
      - HEARTH_BACKUP_PRIMARY=${HEARTH_BACKUP_PRIMARY:-local}
      - HEARTH_BACKUP_PASSPHRASE=${HEARTH_BACKUP_PASSPHRASE:-}
      - HEARTH_BACKUP_DIR=${HEARTH_BACKUP_DIR:-}
      - HEARTH_BACKUP_WEBHOOK_URL=${HEARTH_BACKUP_WEBHOOK_URL:-}
      - HEARTH_BACKUP_WEBHOOK_AUTH=${HEARTH_BACKUP_WEBHOOK_AUTH:-}
      - HEARTH_BACKUP_S3_ENDPOINT=${HEARTH_BACKUP_S3_ENDPOINT:-}
      - HEARTH_BACKUP_S3_BUCKET=${HEARTH_BACKUP_S3_BUCKET:-}
      - HEARTH_BACKUP_S3_REGION=${HEARTH_BACKUP_S3_REGION:-}
      - HEARTH_BACKUP_S3_ACCESS_KEY_ID=${HEARTH_BACKUP_S3_ACCESS_KEY_ID:-}
      - HEARTH_BACKUP_S3_SECRET_ACCESS_KEY=${HEARTH_BACKUP_S3_SECRET_ACCESS_KEY:-}
      - HEARTH_BACKUP_S3_PREFIX=${HEARTH_BACKUP_S3_PREFIX:-}
      # Where the app and host updater exchange control files. Must be under the
      # mounted /data so the updater sees it -- with a postgres DATABASE_URL the
      # app can't derive it from the DB path (unlike the PGlite variant), so it
      # would otherwise default to /app/data/updates, which isn't mounted.
      - HEARTH_UPDATE_DIR=${HEARTH_UPDATE_DIR:-/data/updates}
      # Tells the in-app update UI this is the image deploy.
      - HEARTH_DEPLOY=image
      - HEARTH_ALLOW_OPEN=${HEARTH_ALLOW_OPEN:-0}
      # Set to 1 on an internet-facing instance: the startup safety checks then
      # refuse to boot on a config that would expose your data, instead of only
      # warning. Leave 0 on a home LAN.
      - HEARTH_PUBLIC=${HEARTH_PUBLIC:-0}
      # Behind a reverse proxy or tunnel: the hop count that recovers the real
      # client IP, plus the escape hatches for a proxy that doesn't forward
      # x-forwarded-proto or rewrites Host. See docs/deployment.md.
      - HEARTH_TRUST_PROXY=${HEARTH_TRUST_PROXY:-}
      - HEARTH_SECURE_COOKIES=${HEARTH_SECURE_COOKIES:-}
      - HEARTH_ALLOWED_ORIGINS=${HEARTH_ALLOWED_ORIGINS:-}
      # Email (#111) — invite-by-email, address confirmation, password reset.
      # Off until HEARTH_MAIL_TRANSPORT is set. See docs/deployment.md → Email.
      - HEARTH_MAIL_TRANSPORT=${HEARTH_MAIL_TRANSPORT:-}
      - HEARTH_MAIL_FROM=${HEARTH_MAIL_FROM:-}
      - HEARTH_PUBLIC_URL=${HEARTH_PUBLIC_URL:-}
      - HEARTH_SMTP_HOST=${HEARTH_SMTP_HOST:-}
      - HEARTH_SMTP_PORT=${HEARTH_SMTP_PORT:-}
      - HEARTH_SMTP_TLS=${HEARTH_SMTP_TLS:-}
      - HEARTH_SMTP_USER=${HEARTH_SMTP_USER:-}
      - HEARTH_SMTP_PASS=${HEARTH_SMTP_PASS:-}
      # Monitoring (#57): the /healthz free-space threshold, a dead-man's-switch
      # ping after each backup, and a webhook for backup / failed-login alerts.
      # See docs/deployment.md → Monitoring & alerting.
      - HEARTH_DISK_MIN_FREE_MB=${HEARTH_DISK_MIN_FREE_MB:-}
      - HEARTH_BACKUP_HEARTBEAT_URL=${HEARTH_BACKUP_HEARTBEAT_URL:-}
      - HEARTH_ALERT_WEBHOOK=${HEARTH_ALERT_WEBHOOK:-}
      - HEARTH_AUTH_ALERT_THRESHOLD=${HEARTH_AUTH_ALERT_THRESHOLD:-}
      # `off` stops the release check contacting GitHub at all; the compose file
      # is what the in-app update card names in its commands.
      - HEARTH_UPDATE_CHECK=${HEARTH_UPDATE_CHECK:-}
      - HEARTH_COMPOSE_FILE=${HEARTH_COMPOSE_FILE:-}
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    # Cap container logs so they can't fill the disk on an unattended box (#57).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hearth-pgdata:
