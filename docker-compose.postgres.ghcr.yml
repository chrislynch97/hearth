# Hearth from the prebuilt GHCR image AND a real Postgres server — the managed
# equivalent of docker-compose.postgres.yml (which builds from source). Updating
# the app is a pull instead of a rebuild, enabling in-app one-click / automatic
# updates.
#
# Set POSTGRES_PASSWORD in a .env file next to this one:
#
#   POSTGRES_PASSWORD=<random>
#   # optional, defaults below:
#   HEARTH_PORT=9787
#
#   docker compose -f docker-compose.postgres.ghcr.yml up -d      # → http://localhost:9787
#   docker compose -f docker-compose.postgres.ghcr.yml pull       # fetch a newer image
#   docker compose -f docker-compose.postgres.ghcr.yml up -d       # apply it
#
# For in-app one-click / scheduled updates, also install the host updater (see
# scripts/hearth-updater.sh). The app never gets Docker access — it only writes a
# request file into ./data/updates. The updater also replaces this file with the
# release's copy, keeping the previous one as a .bak.
services:
  db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=hearth
      - POSTGRES_DB=hearth
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - hearth-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    # Cap container logs so they can't fill the disk on an unattended box (#57).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  hearth:
    image: ghcr.io/chrislynch97/hearth:latest
    ports:
      - "${HEARTH_PORT:-9787}:8787"
    volumes:
      # Backups + the host updater's control files (./data/updates). The database
      # itself lives in the `db` service's volume.
      - ./data:/data
    # Every HEARTH_* setting in .env reaches the app, including ones added in
    # later releases. Customise in .env (or a compose.override.yml), never in
    # this file: the host updater replaces it with each release's copy. Needs
    # Docker Compose v2.24+. See docs/deployment.md → Configuration.
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed by this deploy's shape; these win over anything in .env.
      - PORT=8787
      - DATABASE_URL=postgres://hearth:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/hearth
      - CLIENT_DIR=/app/dist/client
      # On a postgres:// URL the backup runner would otherwise default to
      # ./data/backups inside the container. Default it to the mounted volume;
      # .env can still point it somewhere else.
      - HEARTH_BACKUP_LOCAL_DIR=${HEARTH_BACKUP_LOCAL_DIR:-/data/backups}
      # Where the app and host updater exchange control files. Must be under the
      # mounted /data so the updater sees it -- with a postgres DATABASE_URL the
      # app can't derive it from the DB path (unlike the PGlite variant), so it
      # would otherwise default to /app/data/updates, which isn't mounted.
      - HEARTH_UPDATE_DIR=${HEARTH_UPDATE_DIR:-/data/updates}
      # Tells the in-app update UI this is the image deploy.
      - HEARTH_DEPLOY=image
      # Kept here so a shell launch works too, not just .env:
      #   HEARTH_ALLOW_OPEN=1 docker compose -f docker-compose.postgres.ghcr.yml up -d
      - HEARTH_ALLOW_OPEN=${HEARTH_ALLOW_OPEN:-0}
      # The layout this file follows. The app warns when it's older than the
      # image expects; bumped only when a release changes this file's structure.
      - HEARTH_COMPOSE_VERSION=1
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    # Cap container logs so they can't fill the disk on an unattended box (#57).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hearth-pgdata:
