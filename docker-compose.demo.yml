# Demo environment. Runs Hearth against a SEPARATE, disposable demo database
# (./data/demo, an embedded PGlite folder) full of deterministic fake data — the
# real database is never touched. Unlike `npm run demo` (which needs a separate
# Vite dev client), this serves the built UI too, so the whole demo is one
# command on :8787.
#
#   docker compose -f docker-compose.demo.yml up --build     # → http://localhost:8787
#   docker compose -f docker-compose.demo.yml down           # stop it
#
# Force a fresh re-seed (wipe + repopulate the demo data) before serving:
#   docker compose -f docker-compose.demo.yml run --rm --service-ports \
#     hearth-demo node dist/demo-server.js --seed
services:
  hearth-demo:
    build: .
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      - PORT=8787
      # Demo PGlite folder, NOT the real database. demo-server.ts seeds this on first run.
      - DATABASE_URL=pglite:/data/demo
      - CLIENT_DIR=/app/dist/client
    # Seed the demo db (idempotent) then serve it. Run node directly on the
    # compiled bundle (not `npm run demo`) so SIGTERM reaches the process and the
    # graceful-shutdown handler closes the database cleanly — npm as the child
    # swallows the signal. tsx isn't in the production image, so this runs the
    # esbuild-bundled dist/demo-server.js.
    command: ["node", "dist/demo-server.js"]
    # Proper PID 1 (tini) so SIGTERM reaches node for a clean shutdown.
    init: true
    restart: unless-stopped
