name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm install` (not `npm ci`): the lockfile is often generated on a
      # different OS/arch than the Linux runner, and `npm ci` is strict about
      # that drift (EUSAGE on platform-specific optional deps). Matches the
      # Dockerfile's reasoning.
      - run: npm install --no-audit --no-fund

      # Fail the build on known-vulnerable *production* deps (high severity+).
      # Dev-only tooling is excluded — it never ships in the runtime image.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # End-to-end smoke suite (#142): the built client against a real demo server.
  # Its own job so a browser failure is legible on its own, and so the unit
  # suite still reports even when the browser install is having a bad day.
  # Runs against demo mode only — `npm run demo` pins the database itself.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm install --no-audit --no-fund

      # Chromium only — this is a canary, not cross-browser coverage.
      - run: npx playwright install --with-deps chromium

      # Builds the client, then boots the demo server and drives it.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Build the runtime image and scan it for known OS + library vulnerabilities
  # before merge. Doesn't push — the image is built locally and handed to Trivy.
  # ignore-unfixed avoids failing on vulns with no available patch; only fixable
  # High/Critical issues break the build.
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: hearth:ci

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hearth:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
