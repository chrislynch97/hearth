name: Weekly image rebuild

# The release workflow only builds an image when a version tag is pushed, so
# between releases the published `:latest` image goes stale and misses OS-level
# patches in the base image. This rebuilds `:latest` from main once a week (and
# on demand) so those patches reach users without cutting a release, then scans
# the result with Trivy. See issue #56.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bake the current release version into the rebuilt image so the in-app
      # update check keeps reporting a real version rather than "unknown".
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Republish only the moving `:latest` pointer. Immutable x.y.z tags are
      # left untouched so a pinned deploy stays reproducible.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: |
            HEARTH_VERSION=${{ steps.version.outputs.tag }}

      # Scan the freshly published image for known OS + library vulnerabilities.
      # ignore-unfixed keeps us from failing on vulns with no available patch;
      # only fixable High/Critical issues break the build.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
