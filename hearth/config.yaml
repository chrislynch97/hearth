# Home Assistant add-on manifest. This is ONLY read by HA's Supervisor — it does
# not affect the default `docker compose` deployment (which uses the repo-root
# Dockerfile). See ./Dockerfile for how the app is built inside the add-on.
name: Hearth
version: "1.0.8"
slug: hearth
description: Private household finance tracker
url: https://github.com/chrislynch97/hearth
# node:24-slim (the add-on's base) is multi-arch, so both a Pi 5 and an x86 HAOS
# box are covered.
arch:
  - aarch64
  - amd64
# Use the tini init (PID 1) so signals are forwarded to node and zombies are
# reaped — required for clean SIGTERM shutdown / no restart loop.
init: true
# Default "Start on boot" to ON, so Hearth comes back after HA restarts, host
# reboots, and HA OS/Core updates. (User can still toggle it in the add-on page.)
boot: auto
# NOTE: no `watchdog` on purpose. HA resets add-on toggles to config defaults on
# every update, so defining a watchdog silently re-enabled it after each update;
# its probe was failing here and restart-looped the add-on. HA still restarts the
# add-on if the container actually crashes, so this only drops the HTTP health poll.
# Expose the web UI on its own port, like Home Assistant's own port.
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: Hearth web UI
# Adds an "Open Web UI" button in the add-on page.
webui: http://[HOST]:[PORT:8787]
# NOTE: intentionally NOT `backup: cold`. Cold backups stop the add-on while HA
# snapshots it — with frequent HA backups that turns into repeated outages. Hot
# (the default) keeps Hearth running during backups. The in-app JSON Export
# (Settings -> Data) remains the consistent, restore-safe backup path.
