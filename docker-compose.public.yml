# Hearth on a public VPS under your own domain, with TLS terminated by Caddy
# (automatic Let's Encrypt certificates). Walkthrough:
# docs/deployment.md → "Option C — public VPS under your own domain".
#
# Nothing but Caddy is published to the internet: the app binds to loopback on
# the host and is reached over the compose network. HEARTH_PUBLIC=1 makes the
# startup safety checks fatal, so a config slip stops the server rather than
# exposing a household's finances.
#
# Set these in a .env file next to this one:
#
#   HEARTH_DOMAIN=hearth.example.com
#   ACME_EMAIL=you@example.com
#
#   docker compose -f docker-compose.public.yml up -d     # → https://$HEARTH_DOMAIN
#   docker compose -f docker-compose.public.yml pull      # fetch a newer image
#   docker compose -f docker-compose.public.yml up -d     # apply it
#
# Point the domain's A/AAAA record at this host *before* the first `up` — Caddy
# needs port 80 reachable on that name to complete the ACME challenge.
#
# Using an external Postgres instead of the embedded PGlite? Copy the `db`
# service (and its volume) from docker-compose.postgres.ghcr.yml, point
# DATABASE_URL at it, and add HEARTH_UPDATE_DIR=/data/updates as that file does.
services:
  caddy:
    image: caddy:2-alpine
    # The only service on a public port. 443/udp is HTTP/3.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates and ACME account keys. Losing this volume means
      # re-issuing on next start, which Let's Encrypt rate-limits — keep it.
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - HEARTH_DOMAIN=${HEARTH_DOMAIN:?set HEARTH_DOMAIN in .env}
      - ACME_EMAIL=${ACME_EMAIL:?set ACME_EMAIL in .env}
    depends_on:
      hearth:
        condition: service_healthy
    init: true
    restart: unless-stopped
    # Cap container logs so they can't fill the disk on an unattended box (#57).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  hearth:
    image: ghcr.io/chrislynch97/hearth:latest
    # Bound to loopback deliberately: the internet reaches Hearth only through
    # Caddy. Published at all so you can `curl http://127.0.0.1:8787/healthz`
    # over SSH when the proxy is what's broken. Docker's published ports bypass
    # ufw/firewalld, so a 0.0.0.0 publish here would serve the app on :8787
    # regardless of what the host firewall says.
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      # Also the exchange point for the host updater's control files (./data/updates).
      - ./data:/data
    environment:
      - PORT=8787
      - DATABASE_URL=pglite:/data/pgdata
      - CLIENT_DIR=/app/dist/client
      # This instance is internet-facing: the startup safety checks refuse to
      # boot on a config that would expose data or disarm the defences, rather
      # than warning into a log nobody reads.
      - HEARTH_PUBLIC=1
      # HEARTH_ALLOW_OPEN has no entry here on purpose: passing it through from
      # .env would let a value left over from a LAN setup reach a public box.
      # One proxy hop (Caddy). The rate limiter and the audit trail then see the
      # real client IP; the session cookie gets `Secure` from x-forwarded-proto.
      # Keep this in step with the Caddyfile, which overwrites X-Forwarded-For.
      - HEARTH_TRUST_PROXY=1
      # Caddy terminates TLS and does forward x-forwarded-proto, so neither of
      # these is normally needed — they're here for a different proxy in front.
      - HEARTH_SECURE_COOKIES=${HEARTH_SECURE_COOKIES:-}
      - HEARTH_ALLOWED_ORIGINS=${HEARTH_ALLOWED_ORIGINS:-}
      # Tells the in-app update UI this is the image deploy (pull-based commands,
      # and one-click / automatic updates with the host updater), and which
      # compose file those commands should name.
      - HEARTH_DEPLOY=image
      - HEARTH_COMPOSE_FILE=docker-compose.public.yml
      # Optional GitHub tokens (read-only PAT), passed through from .env so the
      # update check works on a private repo (#170) and in-app feedback (#86) can
      # file issues. Empty default = feature off. See docs/deployment.md.
      - HEARTH_UPDATE_TOKEN=${HEARTH_UPDATE_TOKEN:-}
      - HEARTH_FEEDBACK_TOKEN=${HEARTH_FEEDBACK_TOKEN:-}
      - HEARTH_FEEDBACK_REPO=${HEARTH_FEEDBACK_REPO:-}
      # Email (#111) — invite-by-email, address confirmation, password reset. On
      # a public instance it's the only account-recovery route, so this is the
      # one to set. See docs/deployment.md → Email.
      - HEARTH_MAIL_TRANSPORT=${HEARTH_MAIL_TRANSPORT:-}
      - HEARTH_MAIL_FROM=${HEARTH_MAIL_FROM:-}
      - HEARTH_PUBLIC_URL=${HEARTH_PUBLIC_URL:-}
      - HEARTH_SMTP_HOST=${HEARTH_SMTP_HOST:-}
      - HEARTH_SMTP_PORT=${HEARTH_SMTP_PORT:-}
      - HEARTH_SMTP_TLS=${HEARTH_SMTP_TLS:-}
      - HEARTH_SMTP_USER=${HEARTH_SMTP_USER:-}
      - HEARTH_SMTP_PASS=${HEARTH_SMTP_PASS:-}
      # Local snapshots: how many to keep, and a directory on another volume if
      # you want them off the database's disk. See docs/deployment.md → Data & backups.
      - HEARTH_BACKUP_KEEP=${HEARTH_BACKUP_KEEP:-}
      - HEARTH_BACKUP_LOCAL_DIR=${HEARTH_BACKUP_LOCAL_DIR:-}
      # Off-site backups: a VPS whose disk you don't own is exactly the case
      # they're for. Set these in .env to turn them on; `directory` mode also
      # needs its target mounted in. See docs/deployment.md → Off-site backups.
      - HEARTH_BACKUP_OFFSITE=${HEARTH_BACKUP_OFFSITE:-off}
      - HEARTH_BACKUP_PASSPHRASE=${HEARTH_BACKUP_PASSPHRASE:-}
      - HEARTH_BACKUP_DIR=${HEARTH_BACKUP_DIR:-}
      - HEARTH_BACKUP_WEBHOOK_URL=${HEARTH_BACKUP_WEBHOOK_URL:-}
      - HEARTH_BACKUP_WEBHOOK_AUTH=${HEARTH_BACKUP_WEBHOOK_AUTH:-}
      - HEARTH_BACKUP_S3_ENDPOINT=${HEARTH_BACKUP_S3_ENDPOINT:-}
      - HEARTH_BACKUP_S3_BUCKET=${HEARTH_BACKUP_S3_BUCKET:-}
      - HEARTH_BACKUP_S3_REGION=${HEARTH_BACKUP_S3_REGION:-}
      - HEARTH_BACKUP_S3_ACCESS_KEY_ID=${HEARTH_BACKUP_S3_ACCESS_KEY_ID:-}
      - HEARTH_BACKUP_S3_SECRET_ACCESS_KEY=${HEARTH_BACKUP_S3_SECRET_ACCESS_KEY:-}
      - HEARTH_BACKUP_S3_PREFIX=${HEARTH_BACKUP_S3_PREFIX:-}
      # Set to `offsite` when the container's disk isn't durable (#114): the
      # off-site copy becomes the backup, so a failed upload fails the backup
      # instead of quietly leaving you with files you're about to lose.
      - HEARTH_BACKUP_PRIMARY=${HEARTH_BACKUP_PRIMARY:-local}
      # Alerting on a box you don't sit next to: a dead-man's-switch ping after
      # each backup, and a webhook for backup / failed-login alerts.
      - HEARTH_BACKUP_HEARTBEAT_URL=${HEARTH_BACKUP_HEARTBEAT_URL:-}
      - HEARTH_ALERT_WEBHOOK=${HEARTH_ALERT_WEBHOOK:-}
      - HEARTH_AUTH_ALERT_THRESHOLD=${HEARTH_AUTH_ALERT_THRESHOLD:-}
      - HEARTH_DISK_MIN_FREE_MB=${HEARTH_DISK_MIN_FREE_MB:-}
      # `off` stops the release check contacting GitHub at all — the app's only
      # outbound request. The dir is where the host updater exchanges control files.
      - HEARTH_UPDATE_CHECK=${HEARTH_UPDATE_CHECK:-}
      - HEARTH_UPDATE_DIR=${HEARTH_UPDATE_DIR:-}
    # Proper PID 1 (tini) so SIGTERM reaches node for a clean shutdown.
    init: true
    restart: unless-stopped
    # Cap container logs so they can't fill the disk on an unattended box (#57).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy-data:
  caddy-config:
